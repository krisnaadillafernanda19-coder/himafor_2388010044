on:
  push:
    branches: [ main ]
    paths:
      - 'web-dinamis/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build dan Push Image
        # Pastikan path build diarahkan ke subfolder web-dinamis
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/web-dinamis:latest ./web-dinamis
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/web-dinamis:latest