name: Deploy KRISNA STORE ke AWS

on:
  push:
    branches:
      - main
    paths:
      - 'web-dinamis/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login ke Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build dan Push Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/web-dinamis:latest ./web-dinamis
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/web-dinamis:latest

      - name: Deploy ke AWS EC2 via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          port: 22
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~/himafor_2388010044
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/web-dinamis:latest
            docker-compose up -d --force-recreate
            docker image prune -f


